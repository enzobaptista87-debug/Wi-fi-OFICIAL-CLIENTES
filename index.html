<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wi-Fi OFICIAL CLIENTES</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      color: #111;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .wifi-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 8px;
      color: #666;
      font-size: 16px;
      line-height: 1.4;
    }

    .ssid {
      margin: 24px 0 20px;
      padding: 14px;
      border-radius: 12px;
      background: #f1f1f1;
      font-size: 18px;
      font-weight: 600;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    #qrcode img,
    #qrcode canvas {
      width: 240px !important;
      height: 240px !important;
      image-rendering: pixelated;
    }

    .instruction {
      margin-top: 20px;
      font-size: 17px;
      font-weight: 600;
    }

    .small {
      margin-top: 8px;
      color: #777;
      font-size: 14px;
      line-height: 1.4;
    }

    .button {
      display: inline-block;
      margin-top: 22px;
      padding: 14px 22px;
      border-radius: 12px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="wifi-icon">📶</div>

    <h1>Wi-Fi</h1>

    <div class="subtitle">
      Aponte a câmera para o QR Code
      para conectar à rede.
    </div>

    <div class="ssid">
      OFICIAL CLIENTES
    </div>

    <div id="qrcode"></div>

    <div class="instruction">
      Escaneie para conectar
    </div>

    <div class="small">
      No iPhone, abra a câmera e aponte para o QR Code.
    </div>

  </div>

  <script>
    const wifi = "WIFI:T:WPA;S:OFICIAL CLIENTES;P:#OFICIAL#0;;";

    new QRCode(document.getElementById("qrcode"), {
      text: wifi,
      width: 240,
      height: 240,
      correctLevel: QRCode.CorrectLevel.M
    });
  </script>

</body>
</html>
